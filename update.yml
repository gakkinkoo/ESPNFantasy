name: Update dashboard
on:
  schedule:
    # UTC times; each Slovak time is listed for winter (CET) and summer (CEST) time.
    # The first step below only lets the run continue when it is really 07/12/16/22/01 in Slovakia.
    - cron: "0 5,6 * * *"     # 07:00
    - cron: "0 10,11 * * *"   # 12:00
    - cron: "0 14,15 * * *"   # 16:00
    - cron: "0 20,21 * * *"   # 22:00
    - cron: "0 23,0 * * *"    # 01:00
  workflow_dispatch:          # manual run (Actions -> Run workflow) always continues
permissions:
  contents: write
concurrency:
  group: dashboard
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Slovak time
        id: gate
        run: |
          H=$(TZ=Europe/Bratislava date +%H)
          echo "Slovak hour: $H"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || echo "07 12 16 22 01" | grep -qw "$H"; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Install packages
        if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt
      - name: Build dashboard
        if: steps.gate.outputs.go == 'true'
        run: python fantasy.py
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
      - name: Publish
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git commit -m "Update dashboard" || echo "No changes"
          git push
