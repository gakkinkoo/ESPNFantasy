name: Update dashboard
on:
  schedule:
    - cron: "0 7 * * *"    # ~08:00 Slovakia (after last night's games)
    - cron: "0 16 * * *"   # ~17:00 Slovakia (before tonight's games, fresh injury news)
  workflow_dispatch:       # lets you run it by hand
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fantasy.py
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
      - run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git commit -m "Update dashboard" || echo "No changes"
          git push
